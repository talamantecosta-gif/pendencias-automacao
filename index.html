<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f7a45">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icone-192.png">
  <title>Pendências Automação – COA Aroeira</title>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <div class="marca">Pendências <b>Automação</b></div>
    <div class="info" id="info">Carregando…</div>
    <div class="acoes">
      <button class="btn primario" id="btnRota">Traçar rota</button>
      <a class="btn" href="apontamentos.html">Apontamentos</a>
      <button class="btn" id="btnAtualizar" title="Enviar apontamentos salvos e baixar dados novos">Sincronizar</button>
      <button class="btn" id="btnSair" title="Sair"><span class="usuario" id="nomeUsuario"></span> · Sair</button>
    </div>
  </header>

  <main class="principal">
    <section class="lista">
      <div class="filtros">
        <input type="search" id="busca" placeholder="Buscar frota, ocorrência, frente, fazenda…">
        <div class="contagem">
          <span id="contagem"></span>
          <label><input type="checkbox" id="mostrarAtendidas"> Mostrar atendidas</label>
        </div>
      </div>
      <div id="itens"></div>
    </section>
    <div id="mapa"></div>
  </main>

  <script src="vendor/leaflet.js"></script>
  <script src="js/cripto.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
