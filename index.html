<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f3d2e">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icone-192.png">
  <link rel="icon" href="img/marca.png">
  <title>Pendências da automação – Bioenergética Aroeira</title>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <img class="logo marca" src="img/marca.png" alt="Bioenergética Aroeira">
    <div class="titulo">
      <strong>Pendências da automação</strong>
      <span id="info">Carregando…</span>
    </div>
    <div class="acoes">
      <button class="btn folha so-pc" id="btnRota">Traçar rota</button>
      <button class="btn so-pc" id="btnAtualizar" title="Envia os apontamentos salvos no aparelho e baixa as pendências novas">Sincronizar</button>
      <a class="btn so-pc" href="apontamentos.html">Apontamentos</a>
      <button class="btn usuario-btn" id="btnSair" title="Sair"><span id="nomeUsuario"></span> <small>Sair</small></button>
    </div>
  </header>

  <main class="principal">
    <section class="lista" aria-label="Pendências">
      <div class="filtros">
        <input type="search" class="busca" id="busca" placeholder="Buscar frota, ocorrência, frente ou fazenda" aria-label="Buscar">
        <div class="segmentos" role="group" aria-label="Filtrar pendências">
          <button type="button" data-f="abertas" aria-pressed="true">Em aberto<b id="nAbertas">0</b></button>
          <button type="button" data-f="atendidas" aria-pressed="false">Atendidas<b id="nAtendidas">0</b></button>
          <button type="button" data-f="todas" aria-pressed="false">Todas<b id="nTodas">0</b></button>
        </div>
      </div>
      <div class="itens" id="itens"></div>
    </section>
    <div id="mapa" aria-label="Mapa das pendências"></div>
  </main>

  <nav class="barra-celular" aria-label="Ações">
    <button class="btn folha" id="btnRotaCel">Traçar rota</button>
    <button class="btn" id="btnSincCel">Sincronizar</button>
    <a class="btn" href="apontamentos.html">Apontamentos</a>
  </nav>

  <script src="vendor/leaflet.js"></script>
  <script src="js/cripto.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
